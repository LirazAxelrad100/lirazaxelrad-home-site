<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer dir="{{dir}}" style="font-family:'Heebo',sans-serif;border-top:1px solid oklch(0.9 0 0);margin-top:80px;">
  <div style="max-width:1100px;margin:0 auto;padding:48px 6vw 40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;">
    <div>
      <div style="font-family:'David Libre',serif;font-size:18px;color:oklch(0.32 0 0);">{{nameLabel}}</div>
      <a href="mailto:{{email}}" style="font-size:14px;color:oklch(0.5 0 0);text-decoration:none;">{{email}}</a>
    </div>
    <div style="display:flex;gap:20px;align-items:center;">
      <sc-for list="{{socials}}" as="s" hint-placeholder-count="3">
        <a href="{{s.href}}" style="font-size:14px;color:oklch(0.5 0 0);text-decoration:none;" style-hover="color:oklch(0.42 0.01 260);">{{s.label}}</a>
      </sc-for>
      <a href="{{mirrorHref}}" style="font-size:13px;color:oklch(0.42 0.01 260);text-decoration:none;">{{mirrorLabel}}</a>
    </div>
  </div>
  <div style="text-align:center;font-size:12px;color:oklch(0.65 0 0);padding-bottom:28px;">{{copyrightText}}</div>
</footer>
</x-dc>
</body>
</html>
